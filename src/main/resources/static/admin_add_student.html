<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 400px;
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        input, select {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #2ecc71;
            transform: translateY(-2px);
        }
        .back-btn {
            background-color: #c0392b;
        }
        .back-btn:hover {
            background-color: #e74c3c;
        }
        .message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Student Registration</h1>
    <form id="studentForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="studentId" placeholder="Student ID (e.g. C24)" required>
        <input type="email" id="email" placeholder="Email" required>

        <select id="department" required>
            <option value="">Select Department</option>
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="CCE">CSE</option>
            <option value="BBA">BBA</option>
            <option value="Other">Other</option>
        </select>

        <input type="text" id="phone" placeholder="Phone Number" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Register</button>
        <button type="button" class="back-btn" onclick="goBack()">Back</button>
        <div id="message" class="message"></div>
    </form>
</div>

<script>
    document.getElementById("studentForm").addEventListener("submit", function(e) {
        e.preventDefault();

        // ✅ Ensure the JSON field matches the entity exactly
        const studentData = {
            name: document.getElementById("name").value.trim(),
            studentId: document.getElementById("studentId").value.trim(),
            email: document.getElementById("email").value.trim(),
            department: document.getElementById("department").value, // must match entity
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value
        };

        fetch("/student/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(studentData)
        })
            .then(res => res.text())
            .then(msg => {
                const messageDiv = document.getElementById("message");
                if(msg === "SUCCESS") {
                    messageDiv.textContent = "Registration Successful";
                    messageDiv.className = "message success";
                    this.reset();
                } else if(msg === "EXIST") {
                    messageDiv.textContent = "Already Exist";
                    messageDiv.className = "message error";
                } else {
                    messageDiv.textContent = "Server Error. Try again.";
                    messageDiv.className = "message error";
                }
            })
            .catch(err => {
                const messageDiv = document.getElementById("message");
                messageDiv.textContent = "Network Error. Try again.";
                messageDiv.className = "message error";
                console.error(err);
            });
    });

    function goBack() {
        window.location.href = "admin_dashboard.html";
    }
</script>

</body>
</html>
