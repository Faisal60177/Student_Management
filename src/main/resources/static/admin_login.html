<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { margin:0; padding:0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #74ebd5, #ACB6E5); height: 100vh; display:flex; justify-content:center; align-items:center; }
        .form-container { background-color:white; padding:40px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width:350px; }
        h1 { text-align:center; color:#2c3e50; margin-bottom:30px; }
        input { width:100%; padding:12px; margin:12px 0; border-radius:8px; border:1px solid #ccc; font-size:16px; }
        button { width:100%; padding:14px; margin-top:15px; font-size:18px; font-weight:bold; border:none; border-radius:10px; cursor:pointer; background-color:#2980b9; color:white; transition:0.3s; }
        button:hover { background-color:#3498db; }
        .back-btn { background-color:#c0392b; }
        .back-btn:hover { background-color:#e74c3c; }
        .error { color:red; text-align:center; margin-top:10px; }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Admin Login</h1>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <button type="button" class="back-btn" onclick="goBack()">Back</button>
        <p id="errorMsg" class="error"></p>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Send JSON in POST body
        fetch("/admin/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username: username, password: password })
        })
            .then(res => res.json())
            .then(success => {
                if (success) {
                    window.location.href = "/admin_dashboard.html";
                } else {
                    document.getElementById("errorMsg").innerText = "Invalid Username or Password";
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById("errorMsg").innerText = "Server error. Try again.";
            });
    });

    function goBack() {
        window.location.href = "/admin.html";
    }
</script>
</body>
</html>
