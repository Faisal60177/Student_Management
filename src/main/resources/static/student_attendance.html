<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student | View Attendance</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background:#f4f6f9; padding:40px; }
        .container { max-width:1200px; margin:auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.15); }
        h2 { margin-bottom:20px; color:#2c3e50; }
        .info { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:15px; }
        .info span { font-weight:600; }
        table { width:100%; border-collapse:collapse; margin:15px 0 30px; }
        thead { background:#34495e; color:#fff; }
        th, td { padding:12px; border:1px solid #ddd; text-align:center; }
        tbody tr:nth-child(even){ background:#f2f4f7; }
        .back-btn{ padding:8px 14px; background:#7f8c8d; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    </style>
</head>

<body>

<div class="container">
    <h2>My Attendance</h2>

    <div class="info">
        <div>Student ID: <span id="studentId">---</span></div>
        <div>Student Name: <span id="studentName">---</span></div>
        <div>Department: <span id="department">---</span></div>
        <div>Semester: <span id="semesterName">---</span> (<span id="semesterNo">---</span>)</div>
    </div>

    <div id="courseTablesContainer"></div>

    <button class="back-btn" onclick="goBack()">Back</button>
</div>

<script>
    window.onload = function () {

        const studentId = localStorage.getItem("studentId");
        if (!studentId) {
            alert("Session expired. Please login again.");
            window.location.href = "student_login.html";
            return;
        }

        document.getElementById("studentId").innerText = studentId;

        // Student profile
        fetch(`http://localhost:8080/student/profile/${studentId}`)
            .then(r => r.json())
            .then(s => {
                document.getElementById("studentName").innerText = s.name || "N/A";
                document.getElementById("department").innerText = s.department || "N/A";
            });

        // Semester
        fetch(`http://localhost:8080/admin/semester/${studentId}`)
            .then(r => r.json())
            .then(sem => {
                document.getElementById("semesterName").innerText = sem.semesterName;
                document.getElementById("semesterNo").innerText = sem.semesterNo;
                loadCourses(studentId, sem.semesterName);
            });
    };

    function loadCourses(studentId, semesterName) {

        fetch(`http://localhost:8080/student/course/student-courses?studentId=${studentId}&semesterName=${semesterName}`)
            .then(r => r.json())
            .then(courses => {

                const container = document.getElementById("courseTablesContainer");
                container.innerHTML = "";

                courses.forEach(course => {

                    const block = document.createElement("div");
                    block.innerHTML = `
                    <div class="info">
                        <div>Course Code: <span>${course.courseCode}</span></div>
                        <div>Course Name: <span>${course.courseName}</span></div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>SL</th>
                                <th>Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                `;

                    container.appendChild(block);
                    const tbody = block.querySelector("tbody");

                    fetch(`http://localhost:8080/admin/attendance/view?studentId=${studentId}&courseCode=${course.courseCode}&semesterName=${semesterName}`)
                        .then(r => r.json())
                        .then(records => {
                            records.forEach((a,i)=>{
                                tbody.innerHTML += `
                                <tr>
                                    <td>${i+1}</td>
                                    <td>${a.attendanceDate}</td>
                                    <td>${a.status}</td>
                                </tr>`;
                            });
                        });
                });
            });
    }

    function goBack() {
        window.location.href = "student_dashboard.html";
    }
</script>

</body>
</html>
