<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #27ae60;
            color: white;
            transition: 0.3s;
        }

        button:hover { background-color: #2ecc71; }

        .back-btn { background-color: #c0392b; }
        .back-btn:hover { background-color: #e74c3c; }

        .message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .success { color: green; }
        .error { color: red; }
    </style>
</head>

<body>

<div class="form-container">
    <h1>Student Login</h1>

    <form id="studentLoginForm">
        <input type="text" id="studentId" placeholder="Student ID (e.g. C24)" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
        <button type="button" class="back-btn" onclick="goBack()">Back</button>

        <div id="message" class="message"></div>
    </form>
</div>

<script>
    document.getElementById("studentLoginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const studentId = document.getElementById("studentId").value.trim();
        const password = document.getElementById("password").value.trim();

        const studentData = {
            studentId: studentId,
            password: password
        };

        const messageDiv = document.getElementById("message");

        fetch("http://localhost:8080/student/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(studentData)
        })
            .then(response => response.json())
            .then(success => {
                if (success) {
                    // ✅ SAVE STUDENT ID FOR DASHBOARD
                    localStorage.setItem("studentId", studentId);

                    messageDiv.textContent = "Login Successful!";
                    messageDiv.className = "message success";

                    setTimeout(() => {
                        window.location.href = "student_dashboard.html";
                    }, 800);
                } else {
                    messageDiv.textContent = "Invalid Student ID or Password";
                    messageDiv.className = "message error";
                }
            })
            .catch(error => {
                console.error(error);
                messageDiv.textContent = "Server Error!";
                messageDiv.className = "message error";
            });
    });

    function goBack() {
        window.location.href = "student.html";
    }
</script>

</body>
</html>
